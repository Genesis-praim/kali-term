name: Build Kali Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con submódulos Termux)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar binarios nativos (proot arm64 y utils)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # proot estático arm64 (proot-static de Termux o proot-distro)
          curl -L -o app/src/main/jniLibs/arm64-v8a/libproot.so \
            https://github.com/proot-me/proot/releases/latest/download/proot-v5.4.0-aarch64-static || true
          # sh/curl/tar/xz/sha256sum: se toman de un rootfs busybox arm64 o termux-static.
          # (rellenar con las URLs de tus binarios estáticos arm64)

      - name: Fijar sha256 del rootfs Kali
        run: |
          SHA=$(curl -sL https://kali.download/nethunter-images/current/rootfs/kali-nethunter-rootfs-minimal-arm64.tar.xz.sha256sum | awk '{print $1}')
          echo "Rootfs sha256: $SHA"
          sed -i "s|ROOTFS_SHA256:-}|ROOTFS_SHA256:-$SHA}|" app/src/main/assets/bootstrap/bootstrap.sh || true

      - name: Gradle build
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: kali-terminal-apk
          path: app/build/outputs/apk/release/*.apk
