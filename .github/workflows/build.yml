name: Build Kali Terminal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con submódulos Termux)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # proot (libproot.so, arm64) ya va versionado en app/src/main/jniLibs/arm64-v8a.
      # El resto del bootstrap (descarga/xz/tar) es Kotlin puro: sin binarios extra.

      - name: Fijar sha256 del rootfs Kali
        run: |
          SHA=$(curl -sL https://kali.download/nethunter-images/current/rootfs/kali-nethunter-rootfs-minimal-arm64.tar.xz.sha256sum | awk '{print $1}')
          echo "Rootfs sha256: $SHA"
          F=app/src/main/java/com/genesis/kaliterm/BootstrapManager.kt
          sed -i "s|const val ROOTFS_SHA256 = \"\"|const val ROOTFS_SHA256 = \"$SHA\"|" "$F" || true

      - name: Gradle build
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: kali-terminal-apk
          path: app/build/outputs/apk/release/*.apk
