plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.genesis.kaliterm'
    compileSdk 34

    defaultConfig {
        applicationId "com.genesis.kaliterm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Kali NetHunter rootfs solo tiene arm64/armhf; empaquetamos arm64.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Los binarios nativos (proot, sh, curl, tar, xz) se colocan en
    // app/src/main/jniLibs/arm64-v8a/ con nombre lib*.so y se extraen al instalar.
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // firmado debug para CI; cambia a release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Bootstrap en Kotlin puro: descompresión xz + desempaquetado tar
    implementation 'org.tukaani:xz:1.9'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    // Render del terminal (Termux, Apache-2.0)
    implementation project(':terminal-view')
    implementation project(':terminal-emulator')
    implementation project(':termux-shared')
}
